name: Reproduction and Android checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reproduce_firmware:
        description: Download the firmware release and run exact reproduction
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  offline-instruction-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Replay original instructions and reject archived r2 branch targets
        run: |
          python tools/fetch_firmware.py --variant current
          python tools/probe_pi32v2.py --fetch-simulator --report analysis/emulation/baseline.json
      - name: Reproduce bounded application-entry blockers
        run: |
          python tools/fetch_firmware.py --variant original
          python tools/probe_boot.py --check-known-blockers --report analysis/emulation/boot-prefix.json

  policies-and-build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Python source and host policy checks
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q tools -x 'jl-misctools|build|reference-cache'
          bash tools/android-query/test.sh
          bash tools/eq-toggle/test.sh
          python tools/usb-recovery/test_recovery.py
      - name: Download hash-pinned Android dependencies
        run: python tools/bootstrap.py --android
      - name: Install Android 35 build tools
        run: |
          python - <<'PY'
          import os, subprocess
          sdk = os.environ['ANDROID_HOME'] + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([sdk, '--licenses'], input='y\n' * 100, text=True, check=True, stdout=subprocess.DEVNULL)
          subprocess.run([sdk, 'platforms;android-35', 'build-tools;35.0.0'], check=True)
          PY
      - name: Build and verify APK for a synthetic target only
        env:
          H3S_BLE_ADDRESS: '02:00:00:00:00:01'
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash tools/android-query/build.sh

  firmware-reproduction:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.reproduce_firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/fetch_firmware.py --variant both
      - run: python tools/check_reproduction.py
